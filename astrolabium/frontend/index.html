<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrolabium Caudae Rubrae</title>

    <!-- React and Babel for in-browser transpilation -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Dark theme styling -->
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-dim: #808080;
            --accent-primary: #d4af37;  /* Gold */
            --accent-secondary: #8b7355; /* Dark gold */
            --accent-law-unity: #ff6b6b; /* Red for Law Unity */
            --border: #333;

            /* Wu Xing element colors */
            --element-wood: #228b22;
            --element-fire: #dc143c;
            --element-earth: #daa520;
            --element-metal: #c0c0c0;
            --element-water: #4682b4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: var(--accent-primary);
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .error {
            background: #3a1515;
            border: 1px solid #8b0000;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Component containers */
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel h2 {
            color: var(--accent-primary);
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 400;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        /* Grid layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-full {
            grid-column: 1 / -1;
        }

        /* Form elements */
        input, select, button {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 10px;
        }

        button {
            cursor: pointer;
            background: var(--accent-secondary);
            transition: background 0.3s;
        }

        button:hover {
            background: var(--accent-primary);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 15px;
        }

        /* Alignment indicators */
        .alignment-active {
            background: linear-gradient(135deg, var(--accent-law-unity), var(--accent-secondary));
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
            50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.8); }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading spinner */
        .spinner {
            border: 3px solid var(--bg-tertiary);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Data display */
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label {
            color: var(--text-secondary);
        }

        .data-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Progress bar */
        .progress-bar {
            width: 100%;
            height: 20px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            transition: width 0.3s ease;
        }

        /* Status indicator */
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-dot.active {
            background: #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Additional styles for state display */
        .law-unity-alert {
            background: linear-gradient(135deg, var(--accent-law-unity), var(--accent-primary));
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }

        .law-name {
            color: var(--accent-primary);
            font-size: 1.4rem;
            margin: 10px 0;
            font-weight: 500;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .perceptions {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .perceptions .positive,
        .perceptions .negative {
            margin: 5px 0;
            color: var(--text-primary);
        }

        .perceptions strong {
            color: var(--accent-secondary);
        }

        .last-update {
            text-align: center;
            color: var(--text-dim);
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .no-location {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .error-message {
            background: #3a1515;
            border: 1px solid #8b0000;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .element-wood { color: var(--element-wood) !important; }
        .element-fire { color: var(--element-fire) !important; }
        .element-earth { color: var(--element-earth) !important; }
        .element-metal { color: var(--element-metal) !important; }
        .element-water { color: var(--element-water) !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- API Service -->
    <script type="text/babel">
        // API Service Layer
        class AstrolabiumAPI {
            constructor(baseURL = 'http://localhost:8000') {
                this.baseURL = baseURL;
            }

            async getState(lat, lon, tz, dt = null) {
                const params = new URLSearchParams({ lat, lon, tz });
                if (dt) params.append('dt', dt);

                const response = await fetch(`${this.baseURL}/state?${params}`);
                if (!response.ok) throw new Error(`API Error: ${response.statusText}`);
                return response.json();
            }

            async getProjection(lat, lon, tz, start, end, interval = 60) {
                const params = new URLSearchParams({ lat, lon, tz, start, end, interval });
                const response = await fetch(`${this.baseURL}/projection?${params}`);
                if (!response.ok) throw new Error(`API Error: ${response.statusText}`);
                return response.json();
            }

            async getNextUnity(lat, lon, tz) {
                const params = new URLSearchParams({ lat, lon, tz });
                const response = await fetch(`${this.baseURL}/next-unity?${params}`);
                if (!response.ok) throw new Error(`API Error: ${response.statusText}`);
                return response.json();
            }

            async checkHealth() {
                try {
                    const response = await fetch(`${this.baseURL}/health`);
                    return response.ok;
                } catch {
                    return false;
                }
            }
        }

        // Global API instance
        const api = new AstrolabiumAPI();
    </script>

    <!-- React Components -->
    <script type="text/babel" src="components/LocationInput.js"></script>
    <script type="text/babel" src="components/StateDisplay.js"></script>
    <script type="text/babel" src="components/OrganClock.js"></script>
    <script type="text/babel" src="components/DivineHour.js"></script>
    <script type="text/babel" src="components/AlignmentPanel.js"></script>
    <script type="text/babel" src="components/CalendarPanel.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
